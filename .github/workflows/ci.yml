name: MUD Game CI/CD Pipeline

# 触发条件
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# 环境变量
env:
  PYTHON_VERSION: '3.8'
  APP_NAME: 'mud-game'
  COVERAGE_THRESHOLD: '80'

jobs:
  # 代码质量检查
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install radon
          pip install bandit
          pip install safety

      - name: 代码格式检查 (Black)
        run: |
          black --check --diff src/ tests/

      - name: 代码风格检查 (isort)
        run: |
          isort --check-only --diff src/ tests/

      - name: 代码质量分析 (flake8)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 类型检查 (mypy)
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional || true

      - name: 圈复杂度分析 (radon)
        run: |
          radon cc src/ -a -nb
          radon mi src/

      - name: 安全检查 (bandit)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: 依赖安全检查 (safety)
        run: |
          safety check --json > safety-report.json || true

      - name: 上传质量报告
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-reports
          path: |
            bandit-report.json
            safety-report.json

  # 单元测试
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-html
          pip install pytest-xdist
          pip install pytest-mock
          pip install coverage[toml]

      - name: 运行单元测试
        run: |
          python -m pytest tests/ -v \
            --cov=src/ \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --html=test-report.html \
            --self-contained-html \
            --junitxml=test-results.xml

      - name: 检查测试覆盖率
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: 上传测试报告
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            test-report.html
            coverage.xml
            test-results.xml
            htmlcov/

      - name: 发布测试结果
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

      - name: 发布覆盖率报告
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # 集成测试
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: 运行集成测试
        run: |
          python -m pytest tests/integration/ -v \
            --html=integration-test-report.html \
            --self-contained-html

      - name: 上传集成测试报告
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-reports
          path: integration-test-report.html

  # 构建与打包
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: 构建包
        run: |
          python -m build

      - name: 检查包
        run: |
          twine check dist/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  # 部署（仅 main 分支）
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 下载构建产物
        uses: actions/download-artifact@v3
        with:
          name: python-packages
          path: dist/

      - name: 部署到生产环境
        run: |
          echo "部署到生产环境"
          # 这里添加实际的部署逻辑
          # 例如：部署到云服务器、容器化部署等

      - name: 创建发布标签
        run: |
          TAG="v${{ github.run_number }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a $TAG -m "Release $TAG"
          git push origin $TAG

  # 通知
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build]
    if: always()
    steps:
      - name: 检查任务状态
        id: check-status
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.integration-tests.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: 发送成功通知
        if: steps.check-status.outputs.status == 'success'
        run: |
          echo "✅ CI/CD Pipeline 成功完成！"
          echo "分支: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"

      - name: 发送失败通知
        if: steps.check-status.outputs.status == 'failure'
        run: |
          echo "❌ CI/CD Pipeline 失败！"
          echo "分支: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"
          echo "请检查日志并修复问题"

      - name: 更新 Build 状态
        run: |
          echo "Build Status: ${{ steps.check-status.outputs.status }}"