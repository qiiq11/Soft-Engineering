openapi: 3.0.0
info:
  title: MUD Game API
  version: 1.0.0
  description: 用于Mock测试的接口契约（无认证版本）

servers:
  - url: http://127.0.0.1:4010

paths:

  /player:
    get:
      summary: 获取玩家信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                id: 1
                name: "player1"
                level: 5
                hp: 100

  /player/status:
    get:
      summary: 获取玩家状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                hp: 100
                mp: 50
                status: "正常"

  /room:
    get:
      summary: 获取房间信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                roomId: 101
                name: "新手村"
                description: "一个安全的起始区域"

  /movement:
    post:
      summary: 玩家移动
      requestBody:
        required: true
        content:
          application/json:
            example:
              direction: "north"
      responses:
        '200':
          description: 移动成功
          content:
            application/json:
              example:
                message: "移动成功"
                newRoom: "森林入口"

  /combat/attack:
    post:
      summary: 攻击敌人
      responses:
        '200':
          description: 攻击成功
          content:
            application/json:
              example:
                damage: 20
                targetHp: 80
                result: "命中"

  /inventory:
    get:
      summary: 获取背包
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                items:
                  - name: "木剑"
                  - name: "药水"

  /item/pickup:
    post:
      summary: 拾取物品
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                message: "拾取成功"
                item: "金币"

  /game/start:
    post:
      summary: 开始游戏
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                message: "游戏开始"
                playerId: 1

  /help:
    get:
      summary: 获取帮助
      responses:
        '200':
          description: 成功
          content:
            application/json:
              example:
                commands:
                  - "move"
                  - "attack"
                  - "pickup"